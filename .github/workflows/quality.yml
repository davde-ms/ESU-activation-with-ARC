name: PowerShell quality

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pinned PowerShell test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $parseErrors = foreach ($file in Get-ChildItem -Path . -Filter *.ps1 -Recurse) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              $errors | ForEach-Object {
                  [pscustomobject]@{
                      File = $file.FullName
                      Line = $_.Extent.StartLineNumber
                      Message = $_.Message
                  }
              }
          }
          if ($parseErrors) {
              $parseErrors | Format-Table -AutoSize
              throw "PowerShell parsing failed with $($parseErrors.Count) error(s)."
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./Scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize
          if ($findings) {
              throw "PSScriptAnalyzer reported $($findings.Count) error or warning finding(s)."
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests -PassThru
          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed test(s)."
          }

      - name: Check whitespace
        shell: pwsh
        run: git -c core.whitespace=cr-at-eol diff --check HEAD^ HEAD

      - name: Check committed content for credential material
        shell: pwsh
        run: |
          $patterns = @(
              '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
              'Authorization\s*[:=]\s*["'']?Bearer\s+eyJ'
              'AKIA[0-9A-Z]{16}'
              'gh[pousr]_[A-Za-z0-9_]{36,}'
          )
          $matches = Get-ChildItem -Path . -File -Recurse |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
              Select-String -Pattern $patterns
          if ($matches) {
              $matches | Select-Object Path, LineNumber, Line | Format-Table -AutoSize
              throw 'Potential credential material was found in committed content.'
          }
